name: training-docker
services:
  app:
    image: training-tasks:workshop
    build: ./app
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:3000"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: tasks
      MYSQL_PASSWORD: ${DB_PASSWORD:-classroom-only}
      MYSQL_DB: tasks
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/items').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  db:
    image: mysql:9.7.2
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: tasks
      MYSQL_USER: tasks
      MYSQL_PASSWORD: ${DB_PASSWORD:-classroom-only}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u tasks -D tasks -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  mysql-data:
