# Standalone example with its own volume. Run from the repository root.
name: training-secrets
services:
  app:
    image: training-tasks:workshop
    build: ../app
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8081:3000"]
    environment:
      MYSQL_HOST: db
      MYSQL_USER: tasks
      MYSQL_DB: tasks
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:9.7.2
    environment:
      MYSQL_DATABASE: tasks
      MYSQL_USER: tasks
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    secrets: [db_password]
    volumes: ["data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$(cat /run/secrets/db_password) mysql -h 127.0.0.1 -u tasks -D tasks -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
secrets:
  db_password:
    file: ../secrets/db-password.example
volumes:
  data:
